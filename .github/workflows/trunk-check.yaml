name: Trunk

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk_check:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify dotnet format
        run: dotnet format TIKR.sln --verify-no-changes

      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@v1

  ollama-diagnosis:
    needs: trunk_check
    if: failure()
    uses: ./.github/workflows/ollama-ci-diagnosis.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      run_id: ${{ github.run_id }}
      workflow_name: Trunk
