# Primary CI gate: build, test, lint, and Ollama failure triage (on failure only).
# One workflow run per push/PR — no workflow_run chains or child workflow spawns.
name: TIKR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tikr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # write so NuGet, Playwright, and Docker layer caches can be saved
  actions: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The docs-only check fetches the PR base itself. Full history is not needed.
          fetch-depth: 1

      - name: Detect code vs docs-only changes (skip expensive build/test/E2E/coverage for pure docs PRs)
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Fail open: if we cannot determine changed files, run full CI.
          echo "code_changed=true" >> "$GITHUB_OUTPUT"
          echo "docker_gate=true" >> "$GITHUB_OUTPUT"
          echo "recent_green=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1 || true
            if git cat-file -e "$BASE^{commit}" 2>/dev/null && git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
              git diff --name-only "$BASE" "$HEAD" > /tmp/changed.txt 2>/dev/null || echo "unknown" > /tmp/changed.txt
            else
              echo "unknown" > /tmp/changed.txt
            fi
          else
            # A push has no PR file list. Do not write a placeholder here: the
            # docs-only branch used to treat the word "code" as a non-code diff
            # and skip tests on main.
            echo "Push event — running full build/test/coverage/E2E."
            echo "push" > /tmp/changed.txt
          fi

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            :
          elif grep -qx 'unknown' /tmp/changed.txt 2>/dev/null || [ ! -s /tmp/changed.txt ]; then
            echo "Could not resolve PR file list — running full build/test/coverage/E2E."
          elif grep -qE '\.(cs|csproj|sln|razor|sh)$|Dockerfile|docker/|scripts/|tests/|coverlet|global\.json|\.ya?ml$' /tmp/changed.txt 2>/dev/null; then
            echo "Code changes detected — running build, test, and coverage."
            if grep -qE '^(docker/|src/TIKR\.(Api|Infrastructure|Shared|SyncfusionDocuments|Web)/|tests/e2e/)|(^|/)Dockerfile|scripts/ci-smoke\.sh|\.github/workflows/ci\.yml$|(^|/)global\.json$|(^|/)Directory\.Build\.props$' /tmp/changed.txt 2>/dev/null; then
              echo "Image or end-to-end files changed — running the Docker and Playwright gate."
            else
              echo "docker_gate=false" >> "$GITHUB_OUTPUT"
              echo "No image inputs changed — dotnet test runs. Docker build and Playwright are skipped."
            fi
          else
            # Only skip when we positively know the PR is docs/non-code.
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "docker_gate=false" >> "$GITHUB_OUTPUT"
            echo "Only docs/markdown or unrelated files changed — skipping heavy steps to save runner time."
          fi
          cat /tmp/changed.txt | head -20 || true

          # Skip redundant heavy steps only on explicit re-runs of an already-green SHA.
          if [ "${{ github.run_attempt }}" != "1" ]; then
            SHA="${{ github.sha }}"
            CURRENT_RUN_ID="${{ github.run_id }}"
            if gh run list --workflow "TIKR CI" --head-sha "$SHA" --status completed --limit 20 \
              --json conclusion,databaseId \
              --jq ".[] | select(.databaseId != ($CURRENT_RUN_ID | tonumber)) | .conclusion" 2>/dev/null \
              | grep -q '^success$'; then
              echo "recent_green=true" >> "$GITHUB_OUTPUT"
              echo "A previous TIKR CI run for this SHA succeeded — skipping redundant heavy steps on re-run."
            fi
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          # No packages.lock.json in this repo. Hash project files instead.
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore TIKR.sln

      - name: Build
        run: dotnet build TIKR.sln --no-restore --configuration Release

      - name: Test with coverage
        if: (steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.code_changed == '') && steps.changes.outputs.recent_green != 'true'
        run: |
          # GrokLicensed is opt-in live xAI (TIKR_RUN_GROK_LIVE=true); never block default CI.
          dotnet test TIKR.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --filter "Category!=GrokLicensed" \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml

      - name: Verify per-assembly coverage thresholds
        if: (steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.code_changed == '') && steps.changes.outputs.recent_green != 'true'
        run: python3 scripts/check_coverage.py coverage
        # On failure, the subsequent "Capture failure snapshot" (if: failure()) will emit structured info.
        # We also write a dedicated file there for high-signal to ollama.

      - name: Setup Node.js for E2E
        if: (steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.code_changed == '') && steps.changes.outputs.recent_green != 'true' && (steps.changes.outputs.docker_gate == 'true' || steps.changes.outputs.docker_gate == '')
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Cache Playwright browsers
        if: (steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.code_changed == '') && steps.changes.outputs.recent_green != 'true' && (steps.changes.outputs.docker_gate == 'true' || steps.changes.outputs.docker_gate == '')
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Set up Docker Buildx
        if: (steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.code_changed == '') && steps.changes.outputs.recent_green != 'true' && (steps.changes.outputs.docker_gate == 'true' || steps.changes.outputs.docker_gate == '')
        uses: docker/setup-buildx-action@v3

      - name: Build API and Web images
        if: (steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.code_changed == '') && steps.changes.outputs.recent_green != 'true' && (steps.changes.outputs.docker_gate == 'true' || steps.changes.outputs.docker_gate == '')
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker/docker-bake.ci.hcl
          targets: smoke
          load: true
          provenance: false

      - name: Docker Build, Smoke Test & E2E Gate
        if: (steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.code_changed == '') && steps.changes.outputs.recent_green != 'true' && (steps.changes.outputs.docker_gate == 'true' || steps.changes.outputs.docker_gate == '')
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
          TIKR_CI_DOCKER_CACHE: gha
          TIKR_CI_SKIP_IMAGE_BUILD: 1
        run: ./scripts/ci-smoke.sh

      - name: Docker and Playwright skipped
        if: (steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.code_changed == '') && steps.changes.outputs.recent_green != 'true' && steps.changes.outputs.docker_gate == 'false'
        run: echo "Library-only diff. dotnet test ran. Docker build and Playwright were skipped."

      - name: Capture failure snapshot
        if: failure()
        run: |
          mkdir -p failure-context
          {
            echo "workflow=TIKR CI"
            echo "run_id=${{ github.run_id }}"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "event=${{ github.event_name }}"
          } > failure-context/meta.txt
          dotnet --info > failure-context/dotnet-info.txt 2>&1 || true
          dotnet test TIKR.sln --no-build --configuration Release --verbosity normal \
            > failure-context/last-test-output.txt 2>&1 || true

          # Emit small structured artifact for ollama diagnosis (resilient when gh logs are empty)
          python3 scripts/check_coverage.py coverage > failure-context/coverage-raw.txt 2>&1 || true
          if grep -qi 'FAIL\|coverage' failure-context/coverage-raw.txt 2>/dev/null; then
            {
              echo "failure_type=coverage-threshold"
              echo "script=scripts/check_coverage.py"
              tail -30 failure-context/coverage-raw.txt | sed 's/^/detail: /'
            } > failure-context/coverage-failure.txt
          fi
          ls -l failure-context/ || true

      - name: Upload failure snapshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-snapshot-${{ github.run_id }}
          path: failure-context/
          retention-days: 14

      - name: Docs-only or recent-green success (no heavy re-run needed)
        if: steps.changes.outputs.code_changed != 'true' || steps.changes.outputs.recent_green == 'true'
        run: |
          echo "build-and-test job completes successfully (docs-only or recently green SHA)."
          echo "Heavy steps were skipped to save time."
          echo "This avoids re-running long build/test/E2E when only docs changed or the exact commit was already successful recently."

  trunk-check:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            global.json

      - name: Verify dotnet format
        run: dotnet format TIKR.sln --verify-no-changes
        # Failure capture (rich diff + reason) happens in the "Capture trunk/format..." step below (if: failure())

      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@v1

      - name: Capture trunk/format failure snapshot
        if: failure()
        run: |
          mkdir -p failure-context
          {
            echo "workflow=TIKR CI / trunk-check"
            echo "run_id=${{ github.run_id }}"
            echo "trunk_failed=true"
          } > failure-context/meta.txt || true

          # Rich structured format failure info for ollama (when full logs missing)
          {
            echo "failure_type=dotnet-format"
            echo "command=dotnet format TIKR.sln --verify-no-changes"
            echo "common_issues=FINALNEWLINE or CHARSET (migrations, .cs files without trailing newline)"
            echo "advice=run 'dotnet format TIKR.sln' locally and commit the result"
            git diff --name-only HEAD 2>/dev/null | head -10 || true
            # If any local mods from previous (rare on verify), show
          } > failure-context/format-failure.txt || true

          ls -l failure-context/ || true

      - name: Upload trunk/format failure snapshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-snapshot-trunk-${{ github.run_id }}
          path: failure-context/
          retention-days: 14

  ollama-diagnosis:
    needs: [build-and-test, trunk-check]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Ollama failure diagnosis
        uses: ./.github/actions/ollama-ci-diagnosis
        with:
          run_id: ${{ github.run_id }}
          workflow_name: TIKR CI
