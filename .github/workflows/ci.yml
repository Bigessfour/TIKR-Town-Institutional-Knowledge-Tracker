# Primary CI gate: build, test, lint, and Ollama failure triage (on failure only).
# One workflow run per push/PR — no workflow_run chains or child workflow spawns.
name: TIKR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tikr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js for E2E
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore
        run: dotnet restore TIKR.sln

      - name: Build
        run: dotnet build TIKR.sln --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test TIKR.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml

      - name: Verify per-assembly coverage thresholds
        run: python3 scripts/check_coverage.py coverage
        # On failure, the subsequent "Capture failure snapshot" (if: failure()) will emit structured info.
        # We also write a dedicated file there for high-signal to ollama.

      - name: Docker Build, Smoke Test & E2E Gate
        env:
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: |
          if [ -z "${SYNCFUSION_LICENSE_KEY}" ]; then
            echo "SYNCFUSION_LICENSE_KEY secret not set — running without licensed Syncfusion tools."
            cp docker/.env.example docker/.env
          else
            cp docker/.env.example docker/.env
            {
              echo "SYNCFUSION_LICENSE_KEY=${SYNCFUSION_LICENSE_KEY}"
              echo "USE_SYNCFUSION_AGENT_TOOLS=true"
            } >> docker/.env
          fi

          docker compose -f docker/docker-compose.yml build
          docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 180 || {
            echo "docker compose up --wait failed or timed out"
            docker compose -f docker/docker-compose.yml logs --tail=50 || true
            exit 1
          }

          curl -sf http://localhost:5000/health || {
            echo "API health failed post-wait"
            docker compose -f docker/docker-compose.yml logs --tail=50 tikr-api || true
            exit 1
          }

          code=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/ 2>/dev/null || echo "000")
          if ! echo "$code" | grep -qE '200|302'; then
            echo "Web check failed with code $code"
            docker compose -f docker/docker-compose.yml logs --tail=50 tikr-web || true
            exit 1
          fi

          agent_ok=false
          for attempt in $(seq 1 6); do
            response=$(curl -sf -F "file=@tests/fixtures/agent-scan/wiley-periodic-report.txt" \
              http://localhost:5000/api/ai/agent-scan || echo '{"error":"curl failed"}')
            if node --input-type=module -e '
              try {
                const data = JSON.parse(process.argv[1] || "{}");
                const hasText = typeof data.extractedText === "string" && data.extractedText.includes("Wiley periodic report due Q1 2026");
                const hasStorage = typeof data.storagePath === "string" && data.storagePath.startsWith("agent-scans/");
                if (hasText && hasStorage) process.exit(0);
              } catch { /* ignore */ }
              process.exit(1);
            ' "$response"; then
              agent_ok=true
              break
            fi
            sleep 4
          done
          if [ "$agent_ok" != "true" ]; then
            echo "::error::Agent scan smoke failed after retries"
            docker compose -f docker/docker-compose.yml logs --tail=30 tikr-api || true
            exit 1
          fi

          # Plain-text fixtures always use stub extraction (UsedSyncfusionTools: false),
          # even when USE_SYNCFUSION_AGENT_TOOLS=true — verify licensed Syncfusion via PDF.
          echo "$response" | grep -q '"usedSyncfusionTools":false' || {
            echo "::error::Expected usedSyncfusionTools:false for plain-text agent-scan fixture"
            exit 1
          }

          if [ -n "${SYNCFUSION_LICENSE_KEY}" ]; then
            pdf_response=$(curl -sf -F "file=@tests/fixtures/agent-scan/minimal-clerk-report.pdf" \
              http://localhost:5000/api/ai/agent-scan || echo '{"error":"curl failed"}')
            echo "$pdf_response" | grep -q "Wiley clerk report" || {
              echo "::error::Licensed PDF agent-scan smoke failed to extract expected text"
              exit 1
            }
            echo "$pdf_response" | grep -q '"usedSyncfusionTools":true' || {
              echo "::error::Expected usedSyncfusionTools:true for PDF when SYNCFUSION_LICENSE_KEY is set"
              exit 1
            }
          fi

          cd tests/e2e
          npm ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/ > /dev/null; then break; fi
            sleep 2
          done
          if [ -n "${SYNCFUSION_LICENSE_KEY}" ]; then
            SYNCFUSION_LICENSE_KEY=${SYNCFUSION_LICENSE_KEY} TIKR_E2E_BASE_URL=http://localhost:8080 \
              npx playwright install --with-deps chromium
            SYNCFUSION_LICENSE_KEY=${SYNCFUSION_LICENSE_KEY} TIKR_E2E_BASE_URL=http://localhost:8080 \
              npx playwright test --reporter=list --timeout=120000
          else
            TIKR_E2E_BASE_URL=http://localhost:8080 \
              npx playwright install --with-deps chromium
            TIKR_E2E_BASE_URL=http://localhost:8080 \
              npx playwright test --reporter=list --timeout=120000
          fi
          cd -

          docker compose -f docker/docker-compose.yml down

      - name: Capture failure snapshot
        if: failure()
        run: |
          mkdir -p failure-context
          {
            echo "workflow=TIKR CI"
            echo "run_id=${{ github.run_id }}"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "event=${{ github.event_name }}"
          } > failure-context/meta.txt
          dotnet --info > failure-context/dotnet-info.txt 2>&1 || true
          dotnet test TIKR.sln --no-build --configuration Release --verbosity normal \
            > failure-context/last-test-output.txt 2>&1 || true

          # Emit small structured artifact for ollama diagnosis (resilient when gh logs are empty)
          python3 scripts/check_coverage.py coverage > failure-context/coverage-raw.txt 2>&1 || true
          if grep -qi 'FAIL\|coverage' failure-context/coverage-raw.txt 2>/dev/null; then
            {
              echo "failure_type=coverage-threshold"
              echo "script=scripts/check_coverage.py"
              tail -30 failure-context/coverage-raw.txt | sed 's/^/detail: /'
            } > failure-context/coverage-failure.txt
          fi
          ls -l failure-context/ || true

      - name: Upload failure snapshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-snapshot-${{ github.run_id }}
          path: failure-context/
          retention-days: 14

  trunk-check:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify dotnet format
        run: dotnet format TIKR.sln --verify-no-changes
        # Failure capture (rich diff + reason) happens in the "Capture trunk/format..." step below (if: failure())

      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@v1

      - name: Capture trunk/format failure snapshot
        if: failure()
        run: |
          mkdir -p failure-context
          {
            echo "workflow=TIKR CI / trunk-check"
            echo "run_id=${{ github.run_id }}"
            echo "trunk_failed=true"
          } > failure-context/meta.txt || true

          # Rich structured format failure info for ollama (when full logs missing)
          {
            echo "failure_type=dotnet-format"
            echo "command=dotnet format TIKR.sln --verify-no-changes"
            echo "common_issues=FINALNEWLINE or CHARSET (migrations, .cs files without trailing newline)"
            echo "advice=run 'dotnet format TIKR.sln' locally and commit the result"
            git diff --name-only HEAD 2>/dev/null | head -10 || true
            # If any local mods from previous (rare on verify), show
          } > failure-context/format-failure.txt || true

          ls -l failure-context/ || true

      - name: Upload trunk/format failure snapshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-snapshot-trunk-${{ github.run_id }}
          path: failure-context/
          retention-days: 14

  ollama-diagnosis:
    needs: [build-and-test, trunk-check]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Ollama failure diagnosis
        uses: ./.github/actions/ollama-ci-diagnosis
        with:
          run_id: ${{ github.run_id }}
          workflow_name: TIKR CI