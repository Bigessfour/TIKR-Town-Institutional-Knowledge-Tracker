# Manual-only entry point for diagnosing a past failed run by id.
# Automatic diagnosis runs inside TIKR CI / Syncfusion smoke via the composite action.
name: Ollama CI Diagnosis

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions run id to diagnose (from Actions URL)
        required: true
        type: string
      model:
        description: Ollama model (llama3.2:3b recommended; llama3.2:1b for speed)
        required: false
        default: llama3.2:3b
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Ollama failure diagnosis
        uses: ./.github/actions/ollama-ci-diagnosis
        with:
          run_id: ${{ github.event.inputs.run_id }}
          model: ${{ github.event.inputs.model }}