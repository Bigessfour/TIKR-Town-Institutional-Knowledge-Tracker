services:
  tikr-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: tikr-api
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "${TIKR_API_HOST_PORT:-5000}:8080"
    volumes:
      - tikr-data:/data
    depends_on:
      - ollama
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/health]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  tikr-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: tikr-web
    env_file:
      - .env
    environment:
      - TIKR_API_URL=http://tikr-api:8080
      - TIKR_DATA_PROTECTION_PATH=/data/.dpkeys
    ports:
      - 8080:8080
    volumes:
      - tikr-data:/data
    depends_on:
      - tikr-api
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: tikr-ollama
    ports:
      - 11434:11434
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  tikr-data:
  ollama-models:
